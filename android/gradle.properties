org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# --- Build Speed Optimizations ---
# Aktifkan build cache lokal (reuse output task yang tidak berubah)
org.gradle.caching=true

# Jalankan task modul independen secara paralel
org.gradle.parallel=true

# Aktifkan file system watching di Linux agar Gradle mendeteksi perubahan file secara instan
org.gradle.vfs.watch=true
